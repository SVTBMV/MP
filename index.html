<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Měsíční přehled výroby</title>
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f1f5f9; --success: #22c55e; --error: #ef4444; --warning: #eab308; --border: #334155;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }

        .status-msg { text-align: center; color: var(--accent); font-style: italic; margin-top: 20px; }
        .msg { padding: 12px; border-radius: 6px; font-size: 0.9rem; font-weight: 500; line-height: 1.4; display: none; }
        .msg.red { display: block; background: rgba(239, 68, 68, 0.15); border: 1px solid var(--error); color: #f87171; }

        .login-box { max-width: 380px; margin: 60px auto; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 30px; text-align: center; }
        .login-box h3 { margin-top: 0; color: var(--accent); }
        .login-box input { width: 100%; background: #0f172a; border: 1px solid var(--border); padding: 14px; border-radius: 8px; color: white; margin-bottom: 15px; outline: none; box-sizing: border-box; font-size: 1rem; text-align: center; letter-spacing: 2px; }
        .login-box input:focus { border-color: var(--accent); }
        .login-box button { width: 100%; background: var(--accent); color: #000; font-weight: bold; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-size: 1rem; }
        .login-box button:hover { opacity: 0.9; }
        .login-error { color: var(--error); font-size: 0.85rem; margin-top: -5px; margin-bottom: 15px; min-height: 1em; }

        .mesice-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 28px; }
        .mesic-btn { background: var(--card); border: 2px solid var(--border); border-radius: 10px; padding: 12px 18px; color: white; font-weight: bold; cursor: pointer; transition: all 0.2s; font-size: 0.9rem; display: flex; align-items: center; gap: 10px; }
        .mesic-btn:hover { border-color: var(--accent); background: #2d3a6d; }
        .mesic-btn.active { border-color: var(--accent); background: var(--accent); color: #000; }
        .mesic-x { font-size: 0.75rem; color: #94a3b8; cursor: pointer; }
        .mesic-x:hover { color: var(--error); }
        .mesic-btn.active .mesic-x { color: rgba(0,0,0,0.5); }
        .mesic-btn.active .mesic-x:hover { color: var(--error); }

        .pridat-mesic-box { display: flex; gap: 10px; margin-bottom: 8px; max-width: 420px; }
        .pridat-mesic-box input { flex: 1; background: var(--card); border: 1px solid var(--border); padding: 12px 14px; border-radius: 8px; color: white; outline: none; font-size: 0.9rem; box-sizing: border-box; }
        .pridat-mesic-box input:focus { border-color: var(--accent); }
        .pridat-mesic-box button { background: var(--accent); color: #000; font-weight: bold; border: none; padding: 12px 18px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; white-space: nowrap; }
        .pridat-mesic-box button:hover { opacity: 0.9; }

        .prehled-karta { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 20px; }
        .prehled-nadpis { font-size: 1.3rem; font-weight: 800; color: #fff; margin-bottom: 4px; }
        .prehled-podnadpis { font-size: 0.85rem; color: #64748b; margin-bottom: 18px; }

        .souhrn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
        .souhrn-karta { background: rgba(15, 23, 42, 0.5); border: 1px solid var(--border); border-radius: 10px; padding: 14px; text-align: center; }
        .souhrn-karta .val { display: block; font-size: 1.3rem; font-weight: 800; color: var(--accent); }
        .souhrn-karta .lbl { display: block; font-size: 0.68rem; color: #94a3b8; text-transform: uppercase; margin-top: 4px; letter-spacing: 0.4px; }

        .sekce-nadpis { font-size: 1rem; font-weight: 800; color: var(--accent); margin: 26px 0 12px; }

        table.prehled-table { width: 100%; border-collapse: collapse; }
        table.prehled-table th, table.prehled-table td { padding: 10px 12px; text-align: center; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
        table.prehled-table th { background: #1e294b; color: var(--accent); text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.5px; }
        table.prehled-table tr:last-child td { border-bottom: none; }
        table.prehled-table td.jmeno-bunka { text-align: left; font-weight: 600; color: #fff; }
        table.prehled-table td.prazdne { color: #475569; }
        table.prehled-table td.zvyrazneno { color: var(--accent); font-weight: 800; }
        .vypomoc-souhrn-karta { border-color: rgba(56, 189, 248, 0.35); margin-bottom: 12px; }

        .prehled-hlavicka-s-tlacitkem { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 14px; margin-bottom: 18px; }
        .tisk-btn { background: var(--card); border: 2px solid var(--accent); color: var(--accent); font-weight: bold; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; white-space: nowrap; }
        .tisk-btn:hover { background: var(--accent); color: #000; }

        .hlavni-menu { display: flex; gap: 12px; margin-bottom: 28px; }
        .hlavni-tab { flex: 1; text-align: center; background: var(--card); border: 2px solid var(--border); border-radius: 12px; padding: 14px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: all 0.2s; }
        .hlavni-tab:hover { border-color: var(--accent); background: #2d3a6d; }
        .hlavni-tab.active { border-color: var(--accent); background: var(--accent); color: #000; }

        .mesic-prehled-hlavicka { display: flex; justify-content: space-between; padding: 6px 0 10px; border-bottom: 2px solid var(--border); margin-bottom: 6px; }
        .mesic-prehled-hlavicka .mesic-prehled-hodnoty span { color: var(--accent); text-transform: uppercase; font-size: 0.7rem; font-weight: 700; }
        .mesic-prehled-radek { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
        .mesic-prehled-radek:last-child { border-bottom: none; }
        .mesic-prehled-nazev { font-weight: 700; color: #fff; min-width: 110px; }
        .mesic-prehled-hodnoty { display: flex; gap: 22px; flex-wrap: wrap; font-size: 0.85rem; color: #cbd5e1; }
        .mesic-prehled-hodnoty span { min-width: 80px; text-align: right; }

        .trend-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
        .trend-graf-karta { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; cursor: pointer; transition: border-color 0.2s; }
        .trend-graf-karta:hover { border-color: var(--accent); }
        .trend-graf-nadpis { font-weight: 700; color: #fff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 0.92rem; }
        .trend-svg { width: 100%; height: auto; display: block; }
        .trend-graf-rozsah { display: flex; justify-content: space-between; font-size: 0.7rem; color: #64748b; margin-top: 4px; }
        .trend-sipka { font-size: 0.78rem; font-weight: 700; padding: 2px 8px; border-radius: 12px; }
        .trend-sipka.trend-dobry { color: var(--success); background: rgba(34, 197, 94, 0.12); }
        .trend-sipka.trend-spatny { color: var(--error); background: rgba(239, 68, 68, 0.12); }
        .trend-sipka.trend-stabilni { color: #94a3b8; background: rgba(148, 163, 184, 0.12); }

        .graf-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        .graf-modal-overlay.open { display: flex; }
        .graf-modal-obsah { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; max-width: 1100px; width: 100%; }
        .graf-modal-hlavicka { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .graf-modal-nadpis { font-size: 1.2rem; font-weight: 800; color: #fff; display: flex; gap: 12px; align-items: center; }
        .graf-modal-zavrit { background: none; border: 1px solid var(--border); color: white; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .graf-modal-zavrit:hover { border-color: var(--error); color: var(--error); }

        /* --- Tiskový výstup (skrytý, zobrazí se jen při tisku) --- */
        #tisk-oblast { display: none; }
        @media print {
            .container { display: none !important; }
            #tisk-oblast { display: block; }
            .tisk-stranka { page-break-after: always; background: #fff; color: #111; padding: 8mm; box-sizing: border-box; font-family: Calibri, Arial, sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .tisk-stranka:last-child { page-break-after: auto; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
        .tisk-nadpis-tabulka { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
        .tisk-nadpis-tabulka td { border: 2px solid #000; padding: 7px 12px; font-weight: 700; font-size: 15pt; }
        .tisk-nadpis-tabulka td.tisk-nadpis-prava { text-align: right; }
        table.tisk-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; font-variant-numeric: tabular-nums; font-family: Calibri, Arial, sans-serif; }
        table.tisk-table th, table.tisk-table td { border: 2px solid #000; padding: 3px 10px; text-align: center; font-size: 14pt; }
        table.tisk-table th { background: #fff; font-weight: 700; text-decoration: underline; }
        table.tisk-table td.prazdne-tisk { color: #999; }
        table.tisk-table td.tisk-zelena { background: #92d050 !important; font-weight: 700; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        table.tisk-table td.tisk-cervena { background: #ff0000 !important; color: #fff; font-weight: 700; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .tisk-spodek { display: flex; align-items: center; gap: 40px; flex-wrap: wrap; }
        .tisk-souhrn { border-collapse: collapse; font-family: Calibri, Arial, sans-serif; width: auto; }
        .tisk-souhrn td { border: 2px solid #000; padding: 3px 10px; font-size: 13pt; }
        .tisk-souhrn td.lbl-tisk { text-align: left; }
        .tisk-souhrn td.val-tisk { font-weight: 700; text-align: right; }
        .tisk-mesic-velky { font-size: 2.2rem; font-weight: 500; color: #111; white-space: nowrap; }
        .tisk-kolac-obal { position: relative; width: min(720px, 92%); aspect-ratio: 1 / 1; margin: 10px auto 30px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .tisk-kolac { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 0 0 1px #999; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .tisk-stitek { position: absolute; transform: translate(-50%, -50%); font-size: 1.2rem; font-weight: 800; color: #111; background: rgba(255,255,255,0.92); padding: 4px 12px; border-radius: 8px; border: 2px solid #333; white-space: nowrap; }

        .kolac-wrap { display: flex; flex-direction: column; align-items: center; gap: 26px; width: 100%; }
        .kolac-obal { position: relative; width: min(900px, 100%); aspect-ratio: 1 / 1; }
        .kolac { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 0 0 1px var(--border); }
        .kolac-stitek { position: absolute; transform: translate(-50%, -50%); font-size: 0.72rem; font-weight: 800; color: #0f172a; background: rgba(255,255,255,0.9); padding: 2px 7px; border-radius: 7px; white-space: nowrap; pointer-events: none; }
        .kolac-legenda { width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px 20px; }
        .legenda-radek { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; }
        .legenda-barva { width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0; }
        .legenda-jmeno { flex: 1; color: #cbd5e1; font-weight: 600; }
        .legenda-procento { font-weight: 800; color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align: center; margin-bottom: 10px; letter-spacing: 2px;">MĚSÍČNÍ PŘEHLED VÝROBY</h1>
    <p style="text-align: center; color: #64748b; margin-top: 0; margin-bottom: 30px;">Souhrn výkonů, neshod a docházky pro obsluhy TB</p>

    <div id="app">
        <div class="login-box">
            <h3>🔒 Zadejte heslo</h3>
            <input type="password" id="heslo-input" placeholder="Heslo" inputmode="numeric"
                onkeydown="if(event.key==='Enter') overitHeslo()">
            <div class="login-error" id="heslo-error"></div>
            <button onclick="overitHeslo()">Vstoupit</button>
        </div>
    </div>
</div>

<script>
    const HESLO = '1592648';

    const DATA_DOC_ID = '1VmwnMcHmvrVSWhj5UimmSG-ZsKkdPcQEMKl22Khqt2E';
    const REZIE_DOC_ID = '1fa0RXA2EEDvlGD-iTCEuXU5LKiMbWJM4EVJOTltWwa4';
    const RUCNI_DOC_ID = '11ncVFAnCGzBGCmzj48Aq8w_rPq8EVprHpBT3M5NO3d8';

    const NAZVY_MESICU = ['Leden', 'Únor', 'Březen', 'Duben', 'Květen', 'Červen', 'Červenec', 'Srpen', 'Září', 'Říjen', 'Listopad', 'Prosinec'];

    function gvizJsonUrl(docId, sheetName) {
        return `https://docs.google.com/spreadsheets/d/${docId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
    }

    function hodnotaBunky(cell) {
        if (cell === null || cell === undefined) return '';
        if (cell.v === null || cell.v === undefined) return '';
        return String(cell.v);
    }

    // Načte list přes Google Visualization API (JSON) - na rozdíl od CSV umí spolehlivě
    // rozpoznat, že požadovaný list neexistuje, a vrátí explicitní chybu.
    async function nacistListGviz(docId, sheetName, popisTabulky) {
        let text;
        try {
            const response = await fetch(gvizJsonUrl(docId, sheetName));
            text = await response.text();
        } catch (e) {
            throw new Error(`Nepodařilo se spojit s tabulkou "${popisTabulky}". Zkontrolujte připojení.`);
        }

        const match = text.match(/setResponse\(([\s\S]*)\)\s*;?\s*$/);
        if (!match) {
            throw new Error(`List "${sheetName}" v tabulce "${popisTabulky}" neexistuje nebo k němu není přístup.`);
        }

        let data;
        try {
            data = JSON.parse(match[1]);
        } catch (e) {
            throw new Error(`List "${sheetName}" v tabulce "${popisTabulky}" se nepodařilo zpracovat.`);
        }

        if (data.status === 'error') {
            throw new Error(`List "${sheetName}" v tabulce "${popisTabulky}" neexistuje.`);
        }

        if (!data.table || !data.table.cols) {
            throw new Error(`List "${sheetName}" v tabulce "${popisTabulky}" je prázdný.`);
        }

        const headerRow = data.table.cols.map(c => c.label || '');
        const dataRows = (data.table.rows || []).map(r => (r.c || []).map(hodnotaBunky));

        return { headerRow, dataRows, podpisObsahu: JSON.stringify(dataRows.slice(0, 3)) };
    }

    // --- CSV pomocné funkce ---
    function parseCSV(text) {
        text = text.replace(/^\uFEFF/, '');
        const rows = [];
        let row = [];
        let field = '';
        let inQuotes = false;
        for (let i = 0; i < text.length; i++) {
            const c = text[i];
            if (inQuotes) {
                if (c === '"') {
                    if (text[i + 1] === '"') { field += '"'; i++; }
                    else { inQuotes = false; }
                } else { field += c; }
            } else {
                if (c === '"') { inQuotes = true; }
                else if (c === ',') { row.push(field); field = ''; }
                else if (c === '\r') { /* ignore */ }
                else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
                else { field += c; }
            }
        }
        if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
        return rows.filter(r => r.length > 1 || (r.length === 1 && r[0].trim() !== ''));
    }

    function ocistitBunku(v) {
        if (v === undefined || v === null) return '';
        return v.replace(/\u00A0/g, ' ').trim().replace(/^'/, '').trim();
    }

    function parseCislo(v) {
        const cisty = ocistitBunku(v).replace(/\s/g, '').replace(',', '.').replace(/[^0-9.\-]/g, '');
        const n = parseFloat(cisty);
        return isNaN(n) ? 0 : n;
    }

    function normalizovatText(s) {
        return String(s || '')
            .toLowerCase()
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .trim()
            .replace(/\s+/g, ' ');
    }

    function formatCislo(n, desetin) {
        return n.toLocaleString('cs-CZ', { minimumFractionDigits: desetin, maximumFractionDigits: desetin });
    }

    function formatKc(n) {
        return `${Math.round(n).toLocaleString('cs-CZ')} Kč`;
    }

    // --- Detekce sloupců podle přesného názvu hlavičky ---
    function najitPresnySloupec(headerRow, presneJmeno) {
        const hlavicky = headerRow.map(h => normalizovatText(ocistitBunku(h)));
        return hlavicky.findIndex(h => h === presneJmeno);
    }

    function detekovatSloupceData(headerRow) {
        return {
            idxCas: najitPresnySloupec(headerRow, 'cas planovany skutecny'),
            idxMnozstvi: najitPresnySloupec(headerRow, 'mnozstvi'),
            idxJmeno: najitPresnySloupec(headerRow, 'cele jmeno'),
            idxOsCislo: najitPresnySloupec(headerRow, 'praci provedl'),
            idxVyrobniPrikaz: najitPresnySloupec(headerRow, 'vyrobni prikaz')
        };
    }

    function detekovatSloupceRezie(headerRow) {
        return {
            idxCas: najitPresnySloupec(headerRow, 'cas celkem vykazany'),
            idxJmeno: najitPresnySloupec(headerRow, 'cele jmeno'),
            idxOsCislo: najitPresnySloupec(headerRow, 'praci provedl')
        };
    }

    // --- Přihlášení ---
    function overitHeslo() {
        const input = document.getElementById('heslo-input');
        const errorEl = document.getElementById('heslo-error');
        const zadane = ocistitBunku(input.value);

        if (zadane === HESLO) {
            zahajitNacitaniMesicu();
        } else {
            errorEl.textContent = 'Nesprávné heslo. Zkuste to znovu.';
            input.value = '';
            input.focus();
        }
    }

    // --- Správa měsíců (uživatel je přidává sám, appka si je pamatuje) ---
    const MESICE_STORAGE_KEY = 'mesicni_prehled_seznam_mesicu_v1';

    function nazevMesiceCZ(klic) {
        const [mm, rrrr] = klic.split('-');
        return `${NAZVY_MESICU[parseInt(mm, 10) - 1]} ${rrrr}`;
    }

    function jePlatnyKlicMesice(klic) {
        return /^(0[1-9]|1[0-2])-\d{4}$/.test(klic);
    }

    function nacistSeznamMesicu() {
        try {
            const raw = localStorage.getItem(MESICE_STORAGE_KEY);
            if (raw) return JSON.parse(raw);
        } catch (e) { /* ignore */ }
        return ['02-2026', '01-2026']; // výchozí předvyplnění pro první použití
    }

    function ulozitSeznamMesicu(seznam) {
        try { localStorage.setItem(MESICE_STORAGE_KEY, JSON.stringify(seznam)); } catch (e) { /* ignore */ }
    }

    function serazenoSestupne(seznam) {
        return [...seznam].sort((a, b) => {
            const [am, ar] = a.split('-').map(Number);
            const [bm, br] = b.split('-').map(Number);
            return br !== ar ? br - ar : bm - am;
        });
    }

    function serazenoVzestupne(seznam) {
        return [...serazenoSestupne(seznam)].reverse();
    }

    async function ziskatOtisknMesice(klic) {
        const vysledek = await nacistListGviz(DATA_DOC_ID, klic, 'Data');
        return { vysledek, otisk: JSON.stringify(vysledek.dataRows) };
    }

    async function pridatMesic() {
        const input = document.getElementById('novy-mesic-input');
        const errorEl = document.getElementById('novy-mesic-error');
        const tlacitko = document.getElementById('pridat-mesic-tlacitko');
        const klic = ocistitBunku(input.value);

        if (!jePlatnyKlicMesice(klic)) {
            errorEl.textContent = 'Zadejte měsíc ve formátu MM-RRRR, např. 03-2026.';
            return;
        }

        let seznam = nacistSeznamMesicu();
        if (seznam.includes(klic)) {
            errorEl.textContent = 'Tento měsíc už je v seznamu.';
            return;
        }

        errorEl.style.color = 'var(--accent)';
        errorEl.textContent = 'Ověřuji, že list existuje...';
        tlacitko.disabled = true;

        try {
            const { vysledek, otisk } = await ziskatOtisknMesice(klic);
            if (vysledek.dataRows.length === 0) {
                throw new Error('list existuje, ale je prázdný');
            }

            // Porovnat s VŠEMI ostatními už přidanými měsíci - pokud je obsah 1:1 identický,
            // jde o fallback na jiný list (Google při neexistujícím listu tiše vrátí jiná data).
            errorEl.textContent = 'Porovnávám s ostatními měsíci...';
            for (const jinyKlic of seznam) {
                const { otisk: otiskJineho } = await ziskatOtisknMesice(jinyKlic);
                if (otiskJineho === otisk) {
                    throw new Error(`obsah je identický s měsícem "${nazevMesiceCZ(jinyKlic)}" — list "${klic}" pravděpodobně v tabulce neexistuje`);
                }
            }

            errorEl.textContent = '';
            seznam.push(klic);
            ulozitSeznamMesicu(seznam);
            celkemNacteno = false;
            input.value = '';
            vykresliVyberMesicu();
            vybratMesic(klic);
        } catch (e) {
            errorEl.style.color = 'var(--error)';
            errorEl.textContent = `List "${klic}" nebyl v tabulce Data nalezen (${e.message}). Zkontrolujte přesný název listu v Google Sheets.`;
        } finally {
            tlacitko.disabled = false;
        }
    }

    function odebratMesic(klic, event) {
        event.stopPropagation();
        let seznam = nacistSeznamMesicu().filter(m => m !== klic);
        ulozitSeznamMesicu(seznam);
        celkemNacteno = false;
        vykresliVyberMesicu();
        const dalsi = serazenoSestupne(seznam);
        if (dalsi.length > 0) vybratMesic(dalsi[0]);
        else document.getElementById('report-app').innerHTML = `<div class="status-msg">Přidejte měsíc, který chcete zobrazit.</div>`;

    function vykresliVyberMesicu() {

        const seznam = serazenoSestupne(nacistSeznamMesicu());
        grid.innerHTML = seznam.map(klic => `
            <div class="mesic-btn" id="mesic-btn-${klic}" onclick="vybratMesic('${klic}')">

                <span class="mesic-x" onclick="odebratMesic('${klic}', event)" title="Odebrat ze seznamu">✕</span>

        app.innerHTML = `
            <div class="hlavni-menu">
                <div class="hlavni-tab active" id="tab-mesicne" onclick="prepnoutHlavniTab('mesicne')">📅 Měsíčně</div>

            <div id="mesicne-obsah">

                    <button id="pridat-mesic-tlacitko" onclick="pridatMesic()">+ Přidat měsíc</button>

                <div class="mesice-grid" id="mesice-grid"></div>

    let celkemNacteno = false;

    function prepnoutHlavniTab(tab) {
        document.getElementById('tab-mesicne').classList.toggle('active', tab === 'mesicne');
        document.getElementById('tab-celkem').classList.toggle('active', tab === 'celkem');
        document.getElementById('mesicne-obsah').style.display = tab === 'mesicne' ? 'block' : 'none';
        document.getElementById('celkem-obsah').style.display = tab === 'celkem' ? 'block' : 'none';
        if (tab === 'celkem' && !celkemNacteno) {
            nacistCelkovyPrehled();
        }
    }

    function vybratMesic(klic) {
        document.querySelectorAll('.mesic-btn').forEach(b => b.classList.remove('active'));
        const btn = document.getElementById(`mesic-btn-${klic}`);
        if (btn) btn.classList.add('active');
        nacistMesic(klic);
    }

    // --- Načtení a zpracování dat konkrétního měsíce ---
    async function zpracovatMesic(klic) {
        const dataList = await nacistListGviz(DATA_DOC_ID, klic, 'Data');

        const dIdx = detekovatSloupceData(dataList.headerRow);
        if (dIdx.idxCas === -1 || dIdx.idxJmeno === -1 || dIdx.idxOsCislo === -1) {
            throw new Error('V tabulce Data se nepodařilo najít potřebné sloupce (Čas plánovaný skutečný / Celé jméno / Práci provedl). Zkontrolujte přesné názvy hlaviček.');
        }

        const osoby = {}; // osCislo -> {jmeno, casCelkem, kusyCelkem, vyrobniPrikazy:Set}
        let celkemCasVsech = 0;
        let celkemKusuVsech = 0;
        const vsechnyVyrobniPrikazy = new Set();

        dataList.dataRows.forEach(cols => {
            const cas = parseCislo(cols[dIdx.idxCas]);
            const jmeno = ocistitBunku(cols[dIdx.idxJmeno]);
            const osCislo = ocistitBunku(cols[dIdx.idxOsCislo]);
            const mnozstvi = dIdx.idxMnozstvi !== -1 ? parseCislo(cols[dIdx.idxMnozstvi]) : 0;
            const vp = dIdx.idxVyrobniPrikaz !== -1 ? ocistitBunku(cols[dIdx.idxVyrobniPrikaz]) : '';
            if (!osCislo || !jmeno) return;

            if (!osoby[osCislo]) osoby[osCislo] = { jmeno, casCelkem: 0, kusyCelkem: 0, vyrobniPrikazy: new Set() };
            osoby[osCislo].casCelkem += cas;
            osoby[osCislo].kusyCelkem += mnozstvi;
            if (vp) osoby[osCislo].vyrobniPrikazy.add(vp);

            celkemCasVsech += cas;
            celkemKusuVsech += mnozstvi;
            if (vp) vsechnyVyrobniPrikazy.add(vp);
        });

        if (Object.keys(osoby).length === 0) {
            throw new Error(`List "${klic}" v tabulce Data neobsahuje žádné platné řádky.`);
        }

        // --- Zpracování tabulky Režie (jen lidé, kteří jsou v tabulce Data) ---
        const rezieMap = {}; // osCislo -> minuty
        try {
            const rezieList = await nacistListGviz(REZIE_DOC_ID, klic, 'Režie');
            const rIdx = detekovatSloupceRezie(rezieList.headerRow);
            if (rIdx.idxCas !== -1 && rIdx.idxOsCislo !== -1) {
                rezieList.dataRows.forEach(cols => {
                    const osCislo = ocistitBunku(cols[rIdx.idxOsCislo]);
                    if (!osCislo || !osoby[osCislo]) return; // jen lidé z první tabulky
                    const cas = parseCislo(cols[rIdx.idxCas]);
                    rezieMap[osCislo] = (rezieMap[osCislo] || 0) + cas;
                });
            }
        } catch (e) {
            // List Režie pro tento měsíc nejde načíst - pokračujeme bez režií (0)
        }

        // --- Zpracování ručně doplňované tabulky (stálí zaměstnanci) ---
        const ruceniMap = {}; // normalizovane jmeno -> {dochazka, neshody}
        let pocetNeshodCelkem = null;
        let cenaNeshodCelkem = null;
        try {
            const ruceniList = await nacistListGviz(RUCNI_DOC_ID, klic, 'Ručně doplňovaná data');
            ruceniList.dataRows.forEach(cols => {
                const jmeno = ocistitBunku(cols[0]);
                if (!jmeno) return;
                const dochazka = parseCislo(cols[1]);
                const neshody = parseCislo(cols[2]);
                const neshodyCelkemRaw = ocistitBunku(cols[4]);
                const cenaRaw = ocistitBunku(cols[5]);

                ruceniMap[normalizovatText(jmeno)] = { dochazka, neshody };

                if (pocetNeshodCelkem === null && neshodyCelkemRaw !== '') pocetNeshodCelkem = parseCislo(neshodyCelkemRaw);
                if (cenaNeshodCelkem === null && cenaRaw !== '') cenaNeshodCelkem = parseCislo(cenaRaw);
            });
        } catch (e) {
            // List s ručními daty pro tento měsíc nejde načíst - pokračujeme bez něj
        }

        // --- Sestavení výsledných řádků ---
        const stali = [];
        const vypomoc = [];

        Object.keys(osoby).forEach(osCislo => {
            const o = osoby[osCislo];
            const rezie = rezieMap[osCislo] || 0;
            const podilProcent = celkemCasVsech > 0 ? (o.casCelkem / celkemCasVsech) * 100 : 0;
            const pocetVP = o.vyrobniPrikazy.size;
            const ksNaVP = pocetVP > 0 ? o.kusyCelkem / pocetVP : 0;

            const ruceniInfo = ruceniMap[normalizovatText(o.jmeno)];

            if (ruceniInfo) {
                const vykonProcent = ruceniInfo.dochazka > 0
                    ? ((o.casCelkem + rezie) / (ruceniInfo.dochazka * 60)) * 100
                    : null;
                stali.push({
                    osCislo, jmeno: o.jmeno, vykonProcent, podilProcent, ksNaVP,
                    neshody: ruceniInfo.neshody, dochazka: ruceniInfo.dochazka
                });
            } else {
                vypomoc.push({ osCislo, jmeno: o.jmeno, podilProcent, ksNaVP, casCelkem: o.casCelkem });
            }
        });

        stali.sort((a, b) => b.podilProcent - a.podilProcent);
        vypomoc.sort((a, b) => b.podilProcent - a.podilProcent);

        // Souhrn všech "výpomoc" dohromady jako jedna položka
        let vypomocSouhrn = null;
        if (vypomoc.length > 0) {
            let vypomocCas = 0;
            let vypomocKusy = 0;
            const vypomocVP = new Set();
            Object.keys(osoby).forEach(osCislo => {
                if (!ruceniMap[normalizovatText(osoby[osCislo].jmeno)]) {
                    vypomocCas += osoby[osCislo].casCelkem;
                    vypomocKusy += osoby[osCislo].kusyCelkem;
                    osoby[osCislo].vyrobniPrikazy.forEach(vp => vypomocVP.add(vp));
                }
            });
            vypomocSouhrn = {
                jmeno: 'Výpomoc celkem',
                pocetLidi: vypomoc.length,
                podilProcent: celkemCasVsech > 0 ? (vypomocCas / celkemCasVsech) * 100 : 0,
                ksNaVP: vypomocVP.size > 0 ? vypomocKusy / vypomocVP.size : 0
            };
        }

        const prumerKsNaVP = vsechnyVyrobniPrikazy.size > 0 ? celkemKusuVsech / vsechnyVyrobniPrikazy.size : 0;

        return {
            celkemCasVsech, celkemKusuVsech, prumerKsNaVP,
            pocetNeshodCelkem, cenaNeshodCelkem,
            stali, vypomoc, vypomocSouhrn
        };
    }

    async function nacistMesic(klic) {
        const reportApp = document.getElementById('report-app');
        reportApp.innerHTML = `<div class="status-msg">Načítám data za ${nazevMesiceCZ(klic)}...</div>`;

        try {
            const data = await zpracovatMesic(klic);
            vykresliReport(klic, data);
        } catch (e) {
            reportApp.innerHTML = `<div class="msg red" style="display:block">Chyba při zpracování dat za ${nazevMesiceCZ(klic)}: ${e.message}</div>`;
        }
    }

    // ============ CELKOVÝ PŘEHLED (všechny měsíce dohromady) ============

    async function nacistCelkovyPrehled() {
        const obsah = document.getElementById('celkem-obsah');
        obsah.innerHTML = `<div class="status-msg">Načítám všechny měsíce, může to chvíli trvat...</div>`;

        const seznamVzestupne = serazenoVzestupne(nacistSeznamMesicu());
        if (seznamVzestupne.length === 0) {
            obsah.innerHTML = `<div class="status-msg">Zatím nemáte přidaný žádný měsíc (přidejte ho v záložce Měsíčně).</div>`;
            return;
        }

        const vysledky = [];
        for (const klic of seznamVzestupne) {
            try {
                const data = await zpracovatMesic(klic);
                vysledky.push({ klic, data });
            } catch (e) {
                // měsíc, který se nepodaří načíst, v celkovém přehledu jen přeskočíme
            }
        }

        if (vysledky.length === 0) {
            obsah.innerHTML = `<div class="msg red" style="display:block">Nepodařilo se načíst žádný měsíc.</div>`;
            return;
        }

        celkemNacteno = true;
        vykresliCelkovyPrehled(vysledky);
    }

    function prumerPole(pole) {
        const platne = pole.filter(v => v !== null && v !== undefined && !isNaN(v));
        if (platne.length === 0) return null;
        return platne.reduce((a, b) => a + b, 0) / platne.length;
    }

    function vykresliCelkovyPrehled(vysledky) {
        const obsah = document.getElementById('celkem-obsah');

        const avgCas = prumerPole(vysledky.map(v => v.data.celkemCasVsech));
        const avgKusy = prumerPole(vysledky.map(v => v.data.celkemKusuVsech));
        const avgKsNaVp = prumerPole(vysledky.map(v => v.data.prumerKsNaVP));
        const avgNeshody = prumerPole(vysledky.map(v => v.data.pocetNeshodCelkem));
        const avgCena = prumerPole(vysledky.map(v => v.data.cenaNeshodCelkem));

        // --- Seznam měsíců, od Ledna nahoře po nejaktuálnější dole ---
        const radkyMesicu = vysledky.map(v => `
            <div class="mesic-prehled-radek">
                <div class="mesic-prehled-nazev">${nazevMesiceCZ(v.klic)}</div>
                <div class="mesic-prehled-hodnoty">
                    <span>${formatCislo(v.data.celkemCasVsech, 0)} min</span>
                    <span>${formatCislo(v.data.celkemKusuVsech, 0)} ks</span>
                    <span>${formatCislo(v.data.prumerKsNaVP, 1)} ks/VP</span>
                    <span>${v.data.pocetNeshodCelkem !== null ? formatCislo(v.data.pocetNeshodCelkem, 0) : '—'} neshod</span>
                    <span>${v.data.cenaNeshodCelkem !== null ? formatKc(v.data.cenaNeshodCelkem) : '—'}</span>
                </div>
            </div>`).join('');

        // --- Trendové grafy ---
        const mesiceLabely = vysledky.map(v => nazevMesiceCZ(v.klic));
        globalniTrendData = {
            cas: { nazev: 'Celkem odvedeno minut', hodnoty: vysledky.map(v => v.data.celkemCasVsech), mesiceLabely, viceJeLepsi: true },
            kusy: { nazev: 'Celkem vyrobeno kusů', hodnoty: vysledky.map(v => v.data.celkemKusuVsech), mesiceLabely, viceJeLepsi: true },
            ksnavp: { nazev: 'Průměr kusů na VP', hodnoty: vysledky.map(v => v.data.prumerKsNaVP), mesiceLabely, viceJeLepsi: true },
            neshody: { nazev: 'Počet neshod TB', hodnoty: vysledky.map(v => v.data.pocetNeshodCelkem), mesiceLabely, viceJeLepsi: false },
            cena: { nazev: 'Cena neshod TB celkem', hodnoty: vysledky.map(v => v.data.cenaNeshodCelkem), mesiceLabely, viceJeLepsi: false }
        };

        const grafyHtml = Object.keys(globalniTrendData).map(id => vykresliTrendKartu(id)).join('');

        // --- Průměry jednotlivců napříč měsíci ---
        const lideMap = {}; // osCislo -> {jmeno, vykon:[], podil:[], ks:[], neshody:[]}
        vysledky.forEach(v => {
            v.data.stali.forEach(p => {
                if (!lideMap[p.osCislo]) lideMap[p.osCislo] = { jmeno: p.jmeno, vykon: [], podil: [], ks: [], neshody: [] };
                lideMap[p.osCislo].jmeno = p.jmeno;
                if (p.vykonProcent !== null && p.vykonProcent !== undefined) lideMap[p.osCislo].vykon.push(p.vykonProcent);
                lideMap[p.osCislo].podil.push(p.podilProcent);
                lideMap[p.osCislo].ks.push(p.ksNaVP);
                if (p.neshody !== undefined) lideMap[p.osCislo].neshody.push(p.neshody);
            });
        });

        const lidePole = Object.keys(lideMap).map(osCislo => {
            const l = lideMap[osCislo];
            return {
                osCislo, jmeno: l.jmeno,
                pocetMesicu: l.podil.length,
                prumerVykon: prumerPole(l.vykon),
                prumerPodil: prumerPole(l.podil),
                prumerKs: prumerPole(l.ks),
                prumerNeshody: prumerPole(l.neshody)
            };
        }).sort((a, b) => (b.prumerVykon || 0) - (a.prumerVykon || 0));

        const lideHtml = lidePole.map(l => `
            <tr>

                <td>${formatCislo(l.prumerPodil, 1)}%</td>
                <td>${formatCislo(l.prumerKs, 1)}</td>
                <td>${l.prumerNeshody !== null ? formatCislo(l.prumerNeshody, 1) : '—'}</td>
            </tr>`).join('');

        obsah.innerHTML = `
            <div class="prehled-karta">
                <div class="prehled-nadpis">📊 Celkový přehled — průměry za ${vysledky.length} ${vysledky.length === 1 ? 'měsíc' : (vysledky.length < 5 ? 'měsíce' : 'měsíců')}</div>
                <div class="souhrn-grid">
                    <div class="souhrn-karta"><span class="val">${avgCas !== null ? formatCislo(avgCas, 0) : '—'}</span><span class="lbl">Ø odvedeno minut</span></div>
                    <div class="souhrn-karta"><span class="val">${avgKusy !== null ? formatCislo(avgKusy, 0) : '—'}</span><span class="lbl">Ø vyrobeno kusů</span></div>
                    <div class="souhrn-karta"><span class="val">${avgKsNaVp !== null ? formatCislo(avgKsNaVp, 1) : '—'}</span><span class="lbl">Ø kusů na VP</span></div>
                    <div class="souhrn-karta"><span class="val">${avgNeshody !== null ? formatCislo(avgNeshody, 0) : '—'}</span><span class="lbl">Ø počet neshod</span></div>
                    <div class="souhrn-karta"><span class="val">${avgCena !== null ? formatKc(avgCena) : '—'}</span><span class="lbl">Ø cena neshod</span></div>
                </div>
            </div>

            <div class="sekce-nadpis">🗓️ Přehled dle měsíců</div>
            <div class="prehled-karta">
                <div class="mesic-prehled-hlavicka">
                    <div class="mesic-prehled-nazev"></div>
                    <div class="mesic-prehled-hodnoty">
                        <span>Minuty</span><span>Kusy</span><span>Ks/VP</span><span>Neshody</span><span>Cena neshod</span>
                    </div>
                </div>
                ${radkyMesicu}
            </div>

            <div class="sekce-nadpis">📈 Trendy v čase</div>
            <div class="trend-grid">${grafyHtml}</div>

            <div class="sekce-nadpis">👤 Průměry jednotlivců</div>
            <div class="prehled-karta">
                <table class="prehled-table">
                    <thead>
                        <tr>
                            <th style="text-align:left;">Jméno</th>
                            <th>Osobní číslo</th>
                            <th>Počet měsíců</th>
                            <th>Ø Výkon %</th>
                            <th>Ø Podíl na výrobě %</th>
                            <th>Ø Počet ks / VP</th>
                            <th>Ø Počet neshod</th>
                        </tr>
                    </thead>
                    <tbody>${lideHtml}</tbody>
                </table>
            </div>`;
    }

    // --- Trendové grafy (SVG + lineární regrese) ---
    let globalniTrendData = {};

    function linearniRegrese(hodnoty) {
        const body = hodnoty.map((v, i) => ({ x: i, y: v })).filter(b => b.y !== null && b.y !== undefined && !isNaN(b.y));
        if (body.length < 2) return null;
        const n = body.length;
        const sumX = body.reduce((a, b) => a + b.x, 0);
        const sumY = body.reduce((a, b) => a + b.y, 0);
        const sumXY = body.reduce((a, b) => a + b.x * b.y, 0);
        const sumXX = body.reduce((a, b) => a + b.x * b.x, 0);
        const jmenovatel = (n * sumXX - sumX * sumX);
        const slope = jmenovatel !== 0 ? (n * sumXY - sumX * sumY) / jmenovatel : 0;
        const intercept = (sumY - slope * sumX) / n;
        return { slope, intercept, body };
    }

    function urcitTrend(hodnoty, viceJeLepsi) {
        const regrese = linearniRegrese(hodnoty);
        if (!regrese) return { text: 'nedostatek dat', trida: '' };
        const prumer = regrese.body.reduce((a, b) => a + b.y, 0) / regrese.body.length;
        const relativniSklon = prumer !== 0 ? (regrese.slope / Math.abs(prumer)) * 100 : 0;

        if (Math.abs(relativniSklon) < 1) return { text: '→ stabilní', trida: 'trend-stabilni' };
        const stoupa = relativniSklon > 0;
        const jeDobre = stoupa === viceJeLepsi;
        return {
            text: stoupa ? '↑ roste' : '↓ klesá',
            trida: jeDobre ? 'trend-dobry' : 'trend-spatny'
        };
    }

    function svgTrendGraf(hodnoty, sirka, vyska) {
        const body = hodnoty.map((v, i) => ({ x: i, y: v })).filter(b => b.y !== null && b.y !== undefined && !isNaN(b.y));
        if (body.length === 0) return `<div class="status-msg">Nedostatek dat pro graf.</div>`;

        const okrajX = 10, okrajY = 14;
        const maxY = Math.max(...body.map(b => b.y));
        const minY = Math.min(...body.map(b => b.y), 0);
        const rozsahY = (maxY - minY) || 1;
        const maxX = Math.max(hodnoty.length - 1, 1);

        const xScale = i => okrajX + (i / maxX) * (sirka - 2 * okrajX);
        const yScale = v => (vyska - okrajY) - ((v - minY) / rozsahY) * (vyska - 2 * okrajY);

        const linePoints = body.map(b => `${xScale(b.x)},${yScale(b.y)}`).join(' ');
        const tecky = body.map(b => `<circle cx="${xScale(b.x)}" cy="${yScale(b.y)}" r="4" fill="var(--accent)" />`).join('');

        const regrese = linearniRegrese(hodnoty);
        let trendPolyline = '';
        if (regrese) {
            const y1 = regrese.slope * 0 + regrese.intercept;
            const y2 = regrese.slope * maxX + regrese.intercept;
            trendPolyline = `<polyline points="${xScale(0)},${yScale(y1)} ${xScale(maxX)},${yScale(y2)}" fill="none" stroke="var(--warning)" stroke-width="2" stroke-dasharray="7,5" />`;
        }

        return `<svg viewBox="0 0 ${sirka} ${vyska}" class="trend-svg">
            <polyline points="${linePoints}" fill="none" stroke="var(--accent)" stroke-width="3" />
            ${trendPolyline}
            ${tecky}
        </svg>`;
    }

    function vykresliTrendKartu(id) {
        const t = globalniTrendData[id];
        const trend = urcitTrend(t.hodnoty, t.viceJeLepsi);
        return `
            <div class="trend-graf-karta" onclick="otevritGrafModal('${id}')">
                <div class="trend-graf-nadpis">${t.nazev} <span class="trend-sipka ${trend.trida}">${trend.text}</span></div>
                ${svgTrendGraf(t.hodnoty, 400, 160)}
                <div class="trend-graf-rozsah"><span>${t.mesiceLabely[0]}</span><span>${t.mesiceLabely[t.mesiceLabely.length - 1]}</span></div>
            </div>`;
    }

    function otevritGrafModal(id) {
        const t = globalniTrendData[id];
        if (!t) return;
        const trend = urcitTrend(t.hodnoty, t.viceJeLepsi);
        document.getElementById('graf-modal-nadpis').innerHTML = `${t.nazev} <span class="trend-sipka ${trend.trida}">${trend.text}</span>`;
        document.getElementById('graf-modal-telo').innerHTML = svgTrendGraf(t.hodnoty, 1000, 480);
        document.getElementById('graf-modal-rozsah').innerHTML = `<span>${t.mesiceLabely[0]}</span><span>${t.mesiceLabely[t.mesiceLabely.length - 1]}</span>`;
        document.getElementById('graf-modal').classList.add('open');
    }

    function zavritGrafModal() {
        document.getElementById('graf-modal').classList.remove('open');
    }

    function radekTabulky(polozka, jeStaly) {
        const vykonBunka = jeStaly
            ? (polozka.vykonProcent !== null && polozka.vykonProcent !== undefined
                ? `<td class="zvyrazneno">${formatCislo(polozka.vykonProcent, 1)}%</td>`
                : `<td class="prazdne">—</td>`)
            : `<td class="zvyrazneno">${formatCislo(polozka.casCelkem, 0)} min</td>`;
        const neshodyBunka = (jeStaly && polozka.neshody !== undefined)
            ? `<td>${formatCislo(polozka.neshody, 0)}</td>`
            : `<td class="prazdne">—</td>`;

        return `
            <tr>
                <td class="jmeno-bunka">${polozka.jmeno}</td>
                <td>${polozka.osCislo}</td>
                ${vykonBunka}
                <td>${formatCislo(polozka.podilProcent, 1)}%</td>
                <td>${formatCislo(polozka.ksNaVP, 1)}</td>
                ${neshodyBunka}
            </tr>`;
    }

    function vykresliGrafVyroby(stali, vypomocSouhrn) {
        const vsichni = [...stali];
        if (vypomocSouhrn) vsichni.push(vypomocSouhrn);
        vsichni.sort((a, b) => b.podilProcent - a.podilProcent);
        if (vsichni.length === 0) return '';

        const barvy = vsichni.map((_, i) => `hsl(${Math.round((i * 360) / vsichni.length)}, 65%, 55%)`);

        let kumulativni = 0;
        const segmentyGradient = [];
        const stitky = [];

        vsichni.forEach((p, i) => {
            const start = kumulativni;
            kumulativni += p.podilProcent;
            segmentyGradient.push(`${barvy[i]} ${start}% ${kumulativni}%`);

            // Popisek na výseči - zobrazit u všech
            const stredProcenta = (start + kumulativni) / 2;
            const uhelRad = (stredProcenta * 3.6 - 90) * (Math.PI / 180);
            const x = 50 + 32 * Math.cos(uhelRad);
            const y = 50 + 32 * Math.sin(uhelRad);
            stitky.push(`<div class="kolac-stitek" style="left:${x}%; top:${y}%;">${p.jmeno.split(' ')[0]}</div>`);
        });

        const legenda = vsichni.map((p, i) => `
            <div class="legenda-radek">
                <span class="legenda-barva" style="background:${barvy[i]};"></span>
                <span class="legenda-jmeno">${p.jmeno}</span>
                <span class="legenda-procento">${formatCislo(p.podilProcent, 1)}%</span>
            </div>`).join('');

        return `
            <div class="sekce-nadpis">📊 Podíl na výrobě</div>
            <div class="prehled-karta">
                <div class="kolac-wrap">
                    <div class="kolac-obal">
                        <div class="kolac" style="background: conic-gradient(${segmentyGradient.join(', ')});"></div>
                        ${stitky.join('')}
                    </div>
                    <div class="kolac-legenda">${legenda}</div>
                </div>
            </div>`;
    }

    let aktualniReportKlic = null;
    let aktualniReportData = null;

    // --- Tiskový výstup (dvě stránky, jen osobní čísla - nikdy jména) ---
    function radekTiskove(p, jeMaxPodil, jeMaxKsNaVp) {
        const vykonBunka = (p.vykonProcent !== null && p.vykonProcent !== undefined)
            ? `<td>${formatCislo(p.vykonProcent, 1)}%</td>`
            : `<td class="prazdne-tisk">—</td>`;
        const neshodyVysoke = p.neshody !== undefined && p.neshody > 10;
        const neshodyBunka = (p.neshody !== undefined)
            ? `<td class="${neshodyVysoke ? 'tisk-cervena' : ''}">${formatCislo(p.neshody, 0)}</td>`
            : `<td class="prazdne-tisk">—</td>`;
        return `
            <tr>
                <td>${p.osCislo}</td>
                ${vykonBunka}
                <td class="${jeMaxPodil ? 'tisk-zelena' : ''}">${formatCislo(p.podilProcent, 1)}%</td>
                <td class="${jeMaxKsNaVp ? 'tisk-cervena' : ''}">${formatCislo(p.ksNaVP, 1)}</td>
                ${neshodyBunka}
            </tr>`;
    }

    function pripravitTisk() {
        if (!aktualniReportData) return;
        const data = aktualniReportData;
        const klic = aktualniReportKlic;

        // Stránka 1: tabulka - jen stálí jednotlivě; výpomoc jde jako "Podíl výroby ostatní" do souhrnu
        const maxPodilOsCislo = data.stali.length > 0
            ? data.stali.reduce((max, p) => p.podilProcent > max.podilProcent ? p : max, data.stali[0]).osCislo
            : null;
        const maxKsNaVpOsCislo = data.stali.length > 0
            ? data.stali.reduce((max, p) => p.ksNaVP > max.ksNaVP ? p : max, data.stali[0]).osCislo
            : null;

        const radkyStali = data.stali.map(p => radekTiskove(
            p, p.osCislo === maxPodilOsCislo, p.osCislo === maxKsNaVpOsCislo
        )).join('');

        const stranka1 = `
            <div class="tisk-stranka">
                <table class="tisk-table">
                    <thead>
                        <tr>
                            <th>Osobní číslo</th>
                            <th>Výkon %</th>
                            <th>Podíl na výrobě %</th>
                            <th>Počet ks / VP</th>
                            <th>Počet neshod TB</th>
                        </tr>
                    </thead>
                    <tbody>${radkyStali}</tbody>
                </table>
                <div class="tisk-spodek">
                    <table class="tisk-souhrn">
                        <tr><td class="lbl-tisk">Podíl výroby ostatní</td><td class="val-tisk">${data.vypomocSouhrn ? formatCislo(data.vypomocSouhrn.podilProcent, 1) + '%' : '0,0%'}</td></tr>
                        <tr><td class="lbl-tisk">Celkem odvedeno minut</td><td class="val-tisk">${formatCislo(data.celkemCasVsech, 0)}</td></tr>
                        <tr><td class="lbl-tisk">Celkem vyrobeno kusů</td><td class="val-tisk">${formatCislo(data.celkemKusuVsech, 0)}</td></tr>
                        <tr><td class="lbl-tisk">Průměr kusů na VP</td><td class="val-tisk">${formatCislo(data.prumerKsNaVP, 1)}</td></tr>
                        <tr><td class="lbl-tisk">Počet neshod TB</td><td class="val-tisk">${data.pocetNeshodCelkem !== null ? formatCislo(data.pocetNeshodCelkem, 0) : '—'}</td></tr>
                        <tr><td class="lbl-tisk">Cena neshod TB celkem</td><td class="val-tisk">${data.cenaNeshodCelkem !== null ? formatKc(data.cenaNeshodCelkem) : '—'}</td></tr>
                    </table>
                    <div class="tisk-mesic-velky">${nazevMesiceCZ(klic)}</div>
                </div>
            </div>`;

        // Stránka 2: graf - stálí jednotlivě, výpomoc jako jedna souhrnná výseč
        const vsichniProGraf = [...data.stali];
        if (data.vypomocSouhrn) vsichniProGraf.push({ osCislo: 'Výpomoc', podilProcent: data.vypomocSouhrn.podilProcent });
        const barvy = vsichniProGraf.map((_, i) => `hsl(${Math.round((i * 360) / vsichniProGraf.length)}, 65%, 50%)`);

        let kumulativni = 0;
        const segmenty = [];
        const stitky = [];
        vsichniProGraf.forEach((p, i) => {
            const start = kumulativni;
            kumulativni += p.podilProcent;
            segmenty.push(`${barvy[i]} ${start}% ${kumulativni}%`);
            const stred = (start + kumulativni) / 2;
            const uhelRad = (stred * 3.6 - 90) * (Math.PI / 180);
            const x = 50 + 34 * Math.cos(uhelRad);
            const y = 50 + 34 * Math.sin(uhelRad);
            stitky.push(`<div class="tisk-stitek" style="left:${x}%; top:${y}%;">${p.osCislo}</div>`);
        });

        const stranka2 = `
            <div class="tisk-stranka">
                <table class="tisk-nadpis-tabulka">
                    <tr><td>Podíl na výrobě</td><td class="tisk-nadpis-prava">${nazevMesiceCZ(klic)}</td></tr>
                </table>
                <div class="tisk-kolac-obal">
                    <div class="tisk-kolac" style="background: conic-gradient(${segmenty.join(', ')});"></div>
                    ${stitky.join('')}
                </div>
            </div>`;

        document.getElementById('tisk-oblast').innerHTML = stranka1 + stranka2;
        window.print();
    }

    function vykresliReport(klic, data) {
        aktualniReportKlic = klic;
        aktualniReportData = data;
        const reportApp = document.getElementById('report-app');

        const staliHtml = data.stali.map(p => radekTabulky(p, true)).join('');
        const vypomocHtml = data.vypomoc.map(p => radekTabulky(p, false)).join('');

        reportApp.innerHTML = `
            <div class="prehled-karta">
                <div class="prehled-hlavicka-s-tlacitkem">
                    <div>
                        <div class="prehled-nadpis">📋 ${nazevMesiceCZ(klic)}</div>
                        <div class="prehled-podnadpis">Souhrnný přehled výkonů, neshod a docházky</div>
                    </div>
                    <button class="tisk-btn" onclick="pripravitTisk()">🖨 Tisk pro nástěnku</button>
                </div>
                <div class="souhrn-grid">
                    <div class="souhrn-karta"><span class="val">${formatCislo(data.celkemCasVsech, 0)}</span><span class="lbl">Celkem odvedeno minut</span></div>
                    <div class="souhrn-karta"><span class="val">${formatCislo(data.celkemKusuVsech, 0)}</span><span class="lbl">Celkem vyrobeno kusů</span></div>
                    <div class="souhrn-karta"><span class="val">${formatCislo(data.prumerKsNaVP, 1)}</span><span class="lbl">Průměr kusů na VP</span></div>
                    <div class="souhrn-karta"><span class="val">${data.pocetNeshodCelkem !== null ? formatCislo(data.pocetNeshodCelkem, 0) : '—'}</span><span class="lbl">Počet neshod celkem</span></div>
                    <div class="souhrn-karta"><span class="val">${data.cenaNeshodCelkem !== null ? formatKc(data.cenaNeshodCelkem) : '—'}</span><span class="lbl">Cena neshod celkem</span></div>
                </div>
            </div>

            <div class="sekce-nadpis">👷 Stálí zaměstnanci</div>
            <div class="prehled-karta">
                ${data.stali.length > 0 ? `
                <table class="prehled-table">
                    <thead>
                        <tr>
                            <th style="text-align:left;">Jméno</th>
                            <th>Osobní číslo</th>
                            <th>Výkon %</th>
                            <th>Podíl na výrobě %</th>
                            <th>Počet ks / VP</th>
                            <th>Počet neshod</th>
                        </tr>
                    </thead>
                    <tbody>${staliHtml}</tbody>
                </table>` : `<div class="status-msg">Žádný stálý zaměstnanec nebyl v ručně doplňované tabulce nalezen (kontrola shody podle jména).</div>`}
            </div>

            <div class="sekce-nadpis">🤝 Výpomoc</div>
            ${data.vypomocSouhrn ? `
            <div class="prehled-karta vypomoc-souhrn-karta">
                <div class="souhrn-grid">
                    <div class="souhrn-karta"><span class="val">${data.vypomocSouhrn.pocetLidi}</span><span class="lbl">Počet lidí ve výpomoci</span></div>
                    <div class="souhrn-karta"><span class="val">${formatCislo(data.vypomocSouhrn.podilProcent, 1)}%</span><span class="lbl">Podíl na výrobě celkem</span></div>
                    <div class="souhrn-karta"><span class="val">${formatCislo(data.vypomocSouhrn.ksNaVP, 1)}</span><span class="lbl">Počet ks / VP (celkem)</span></div>
                </div>
            </div>` : ''}
            <div class="prehled-karta">
                ${data.vypomoc.length > 0 ? `
                <table class="prehled-table">
                    <thead>
                        <tr>
                            <th style="text-align:left;">Jméno</th>
                            <th>Osobní číslo</th>
                            <th>Odvedené minuty</th>
                            <th>Podíl na výrobě %</th>
                            <th>Počet ks / VP</th>
                            <th>Počet neshod</th>
                        </tr>
                    </thead>
                    <tbody>${vypomocHtml}</tbody>
                </table>` : `<div class="status-msg">Tento měsíc nikdo z výpomoci nepracoval.</div>`}
            </div>

            ${vykresliGrafVyroby(data.stali, data.vypomocSouhrn)}`;
    }
</script>

<div id="tisk-oblast"></div>

<div class="graf-modal-overlay" id="graf-modal" onclick="zavritGrafModal()">
    <div class="graf-modal-obsah" onclick="event.stopPropagation()">
        <div class="graf-modal-hlavicka">
            <div class="graf-modal-nadpis" id="graf-modal-nadpis"></div>
            <button class="graf-modal-zavrit" onclick="zavritGrafModal()">✕ Zavřít</button>
        </div>
        <div id="graf-modal-telo"></div>
        <div class="trend-graf-rozsah" id="graf-modal-rozsah"></div>
    </div>
</div>

</body>
</html>
